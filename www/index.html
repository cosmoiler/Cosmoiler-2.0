<!DOCTYPE html>
<html>
  <meta charset="utf-8">
  <!--
  Customize this policy to fit your own app's needs. For more guidance, see:
      https://github.com/apache/cordova-plugin-whitelist/blob/master/README.md#content-security-policy
  Some notes:
    * https://ssl.gstatic.com is required only on Android and is needed for TalkBack to function properly
    * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
      * Enable inline JS: add 'unsafe-inline' to default-src
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: gap: content:">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">

  <meta name="format-detection" content="telephone=no">
<!--   <meta name="theme-color" content="#ecece0"> -->

  <title>Cosmoiler</title>

<!--   <link rel="apple-touch-icon" sizes="120x120" href="icon_120x120.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon_180x180.png"> -->
  <!-- Пути от корня: страница открывается и с вложенного адреса (/route/cfg),
       тогда относительный «favicon32.png» превратился бы в /route/favicon32.png (404). -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon16.png">
  <!-- <link rel="manifest" href="manifest.json"> -->
  <link rel="manifest" href="/manifest.web" />
  <script async src="/pwacompat.min.js"></script>
  <!-- Запуск со значка на экране «Домой» — окном приложения, без адресной строки.
       iPhone/iPad (Safari) читают это и по http:// — в отличие от Android, где
       без https ярлык открывается вкладкой браузера. pwacompat добавляет те же
       теги из manifest.web, но асинхронно; здесь они есть сразу. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cosmoiler">


  <script type="module" crossorigin src="/app.js"></script>
  <link rel="stylesheet" crossorigin href="/app.css">
</head>
<body>
  <div id="app"></div>  <!-- Точка входа. Раньше этот тег вставлял HtmlWebpackPlugin (inject: true);
       теперь index.html сам является entry для Vite. --></body>
</html>
